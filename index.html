<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Guess the Number Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>🎯 Guess the Number (1 to 5)</h1>
        <input type="number" id="inputBox" placeholder="Enter your guess" min="1" max="5">
        <button onclick="guessNumber()">Guess</button>
        <p id="result">Let's begin the game!</p>
        <p id="guessOption">Available Guesses: 3</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
